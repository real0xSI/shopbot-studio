<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bot Toko — ShopBot Studio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#ece5dd;color:#1a1a1a}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:#fff}
header{background:#0b6e4f;color:#fff;padding:14px 16px}
header b{font-size:17px}
header span{display:block;font-size:12px;opacity:.85}
#chat{flex:1;padding:16px;overflow-y:auto}
.msg{max-width:85%;padding:10px 12px;border-radius:12px;margin:8px 0;line-height:1.5;white-space:pre-line;font-size:15px}
.bot{background:#f0f0f0;border-bottom-left-radius:4px}
.me{background:#dcf8c6;margin-left:auto;border-bottom-right-radius:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 8px}
.chips button{background:#fff;border:1px solid #0b6e4f;color:#0b6e4f;border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer}
form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid #eee}
input{flex:1;padding:10px 12px;border:1px solid #ccc;border-radius:20px;font-size:15px}
button.send{background:#0b6e4f;color:#fff;border:0;border-radius:20px;padding:10px 18px;font-weight:700;cursor:pointer}
.note{font-size:12px;color:#777;padding:0 16px 12px}
a{color:#0b6e4f}
</style>
</head>
<body>
<div class="wrap">
<header><b id="shopName">Bot Toko</b><span id="shopSub">CS Bot — online, balas instan · <a href="/" style="color:#fff">← bikin bot tokomu sendiri</a></span></header>
<div id="chat"></div>
<div class="chips" id="chips"></div>
<form id="form"><input id="input" autocomplete="off" placeholder="Tanya harga, stok, ongkir..." maxlength="500"><button class="send" type="submit">Kirim</button></form>
<p class="note" id="note">Bot jawab dari katalog toko — kalau nggak tahu, diteruskan ke admin, bukan ngarang.</p>
</div>
<script>
var params=new URLSearchParams(location.search);
var code=params.get('c');
var shop=null;
var chat=document.getElementById('chat'), chips=document.getElementById('chips'),
    form=document.getElementById('form'), input=document.getElementById('input');
function add(text, cls){var d=document.createElement('div');d.className='msg '+cls;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
function setChips(list){chips.innerHTML='';list.forEach(function(s){var b=document.createElement('button');b.type='button';b.textContent=s;b.onclick=function(){send(s);};chips.appendChild(b);});}
async function send(text){
  if(!text.trim())return;
  add(text,'me');input.value='';
  try{
    var body={message:text};
    if(shop)body.shop=shop; else if(code)body.code=code;
    var r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
    var j=await r.json();
    add(j.reply||j.error||'Error','bot');
    if(j.suggestions)setChips(j.suggestions);
  }catch(e){add('Maaf kak, bot lagi nggak bisa dihubungi. Coba lagi sebentar.','bot');}
}
form.onsubmit=function(e){e.preventDefault();send(input.value);};
async function init(){
  // No ?c= : load the built-in demo shop so /demo works with zero setup.
  if(!code){
    try{
      var r=await fetch('/api/demo-config');var j=await r.json();
      shop=j.shop;
    }catch(e){}
  }
  var name=shop?shop.name:'Toko Demo';
  document.getElementById('shopName').textContent=name;
  document.title='Bot — '+name;
  add('Halo kak! Selamat datang di '+name+(shop&&shop.city?' ('+shop.city+')':'')+'. Saya bot toko, bisa bantu jawab harga, stok, ongkir, cara bayar, dan lacak pesanan. Mau tanya apa?','bot');
  if(shop){
    var first=shop.products[0];
    setChips(['Harga '+first.keywords[0]+'?','Stok '+first.name.split(' ')[0]+'?','Ongkir ke Jakarta?','Cara bayar?','Lacak pesanan']);
    if(shop.demoOrders)document.getElementById('note').textContent='Demo: toko fiktif, data katalog + 2 nomor order contoh (KRN-1042, KRN-1043). Bot jawab dari FAQ toko — kalau nggak tahu, diteruskan ke admin, bukan ngarang.';
  } else {
    setChips(['Harga kemeja?','Stok dress?','Ongkir ke Jakarta?','Cara bayar?','Lacak pesanan']);
  }
}
init();
</script>
</body>
</html>
